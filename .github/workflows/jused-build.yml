name: 'Jused build'

on:
  push:
    branches:
      - 'jused/**'
  workflow_dispatch:

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Build-Windows:
    runs-on: windows-latest

    env:
      QT_VERSION: 6.10.1
      QIF_VERSION: 4.7

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup mvsc'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: 'x64'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build project'
      shell: cmd
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        AMNEZIA_BUILD_TESTS: ON
      run: |
        deploy\build.bat --installer ifw

    - name: 'Run key table tests'
      shell: pwsh
      run: |
        $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
        ctest --test-dir deploy/build/client/tests -C Release -R "KeyTable|MultipleImports|ServerEdit|DefaultServerChange|ServerEdgeCases" --output-on-failure

    - name: 'Upload IFW installer artifact'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/AmneziaVPN_*_windows_x64.exe
        archive: false
        retention-days: 30

  Build-Android:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'android11+'
            qt_version: '6.10.3'
            min_sdk: 30
            max_sdk: ''
            version_code_offset: 1
          - label: 'android9-10'
            qt_version: '6.10.1'
            min_sdk: 28
            max_sdk: 29
            version_code_offset: 0

    env:
      ANDROID_PLATFORM: android-${{ matrix.min_sdk }}
      NDK_VERSION: 27.0.11718014
      QT_VERSION: ${{ matrix.qt_version }}
      QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
      APP_ANDROID_MIN_SDK: ${{ matrix.min_sdk }}
      APP_ANDROID_MAX_SDK: ${{ matrix.max_sdk }}
      APP_ANDROID_VERSION_CODE_OFFSET: ${{ matrix.version_code_offset }}

    steps:
    - name: 'Free disk space'
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /

    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_armv7 Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'android'
        arch: 'android_armv7'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_arm64_v8a Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup Java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Setup Android SDK'
      uses: android-actions/setup-android@v4
      with:
        packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Prepare signing keystore'
      env:
        KEYSTORE_BASE64: ${{ secrets.JUSED_ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASS: ${{ secrets.JUSED_ANDROID_KEYSTORE_PASS }}
      shell: bash
      run: |
        if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASS" ]]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore
          echo "QT_ANDROID_KEYSTORE_ALIAS=jused" >> $GITHUB_ENV
          echo "::add-mask::$KEYSTORE_PASS"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$KEYSTORE_PASS" >> $GITHUB_ENV
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=$KEYSTORE_PASS" >> $GITHUB_ENV
          echo "KEYSTORE_KIND=release" >> $GITHUB_ENV
        else
          echo "::warning::JUSED_ANDROID_KEYSTORE_* secrets are not set, the APK is signed with a throwaway test key"
          TMP_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$TMP_PASS"
          keytool -genkeypair -keystore android.keystore -alias jused -storepass "$TMP_PASS" -keypass "$TMP_PASS" \
            -keyalg RSA -keysize 4096 -validity 3650 -dname "CN=Jused VPN test"
          echo "QT_ANDROID_KEYSTORE_ALIAS=jused" >> $GITHUB_ENV
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=$TMP_PASS" >> $GITHUB_ENV
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=$TMP_PASS" >> $GITHUB_ENV
          echo "KEYSTORE_KIND=test" >> $GITHUB_ENV
        fi

    - name: 'Build project'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
        LABEL: ${{ matrix.label }}
      shell: bash
      run: |
        OUT=deploy/artifacts
        rm -rf $OUT && mkdir -p $OUT

        deploy/build.sh -t android --sign --abi arm64-v8a --abi armeabi-v7a

        VERSION=$(grep CMAKE_PROJECT_VERSION:STATIC deploy/build/CMakeCache.txt | cut -d= -f2)
        mv deploy/build/client/android-build/AmneziaVPN.apk \
           $OUT/AmneziaVPN_${VERSION}_jused_${LABEL}_${KEYSTORE_KIND}.apk
        ls -l $OUT

    - name: 'Upload APK'
      uses: actions/upload-artifact@v7
      with:
        name: AmneziaVPN_jused_${{ matrix.label }}
        path: deploy/artifacts/*.apk
        retention-days: 30
